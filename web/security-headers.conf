# En-têtes de sécurité, inclus dans chaque bloc "location" (nginx n'hérite pas
# des add_header d'un niveau supérieur dès qu'un niveau inférieur en définit un).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# 'unsafe-inline' n'est accepté que pour les styles (composants Angular / PrimeNG).
# Aucun script inline : le build de production ne génère pas de code inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://primefaces.org; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# À activer quand l'application est servie en HTTPS (derrière le reverse proxy de production) :
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
